[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "import-knowledge-package"
version = "0.1.0"
description = "A package for importing knowledge and embedding text."
readme = "README.md"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
license = { text = "MIT" }
keywords = ["knowledge", "embedding", "openai", "chromadb"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.7"
dependencies = [
    "openai>=0.27.0",
    "chromadb>=0.3.21",
    "python-dotenv>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
import_knowledge = ["KB/*.jsonl", "KB/*.metta"]

[project.scripts]
import-knowledge = "import_knowledge.import_knowledge:main"