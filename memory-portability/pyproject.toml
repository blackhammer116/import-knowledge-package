[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-portability"
version = "0.2.0"
description = "OmegaClaw memory backup and restore package."
readme = "README.md"
authors = [
    { name = "Bereket", email = "bereket.eshete@singularitynet.io" }
]
license = { text = "MIT" }
keywords = ["memory", "backup", "restore", "agent", "chromadb", "portability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"

dependencies = ["chromadb>=0.6"]

[project.urls]
Repository = "https://github.com/Bereket-Eshete/memory-portability-package"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
